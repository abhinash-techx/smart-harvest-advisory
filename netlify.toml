[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/recommend"
  to = "/.netlify/functions/recommend"
  status = 200

[[redirects]]
  from = "/api/analyze-soil"
  to = "/.netlify/functions/analyze-soil"
  status = 200

[[redirects]]
  from = "/api/disease"
  to = "/.netlify/functions/disease-detection"
  status = 200

[[redirects]]
  from = "/api/market-insight"
  to = "/.netlify/functions/market-insight"
  status = 200

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/current-weather"
  status = 200
