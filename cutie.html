<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divyanshi - Surprise Mittal Ji 💖</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    overflow: hidden;
  }

  @keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  .container {
    text-align: center;
    color: #fff;
    text-shadow: 2px 2px 10px #000;
  }

  h1 {
    font-size: 4em;
    margin: 0;
    animation: pop 1s ease infinite alternate;
  }

  h2 {
    font-size: 2em;
    margin: 10px 0 0;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes pop {
    0% {transform: scale(1);}
    50% {transform: scale(1.2);}
    100% {transform: scale(1);}
  }

  @keyframes float {
    0% {transform: translateY(0);}
    50% {transform: translateY(-20px);}
    100% {transform: translateY(0);}
  }

  /* Balloon animation */
  .balloon {
    position: absolute;
    bottom: -100px;
    width: 50px;
    height: 70px;
    border-radius: 50% 50% 50% 50%;
    background: radial-gradient(circle at 30% 30%, #ff5f6d, #ffc371);
    animation: rise 8s linear infinite;
  }

  .balloon:nth-child(2) { left: 20%; animation-duration: 10s; background: radial-gradient(circle at 30% 30%, #6a11cb, #2575fc);}
  .balloon:nth-child(3) { left: 40%; animation-duration: 12s; background: radial-gradient(circle at 30% 30%, #ff9a9e, #fad0c4);}
  .balloon:nth-child(4) { left: 60%; animation-duration: 9s; background: radial-gradient(circle at 30% 30%, #43cea2, #185a9d);}
  .balloon:nth-child(5) { left: 80%; animation-duration: 11s; background: radial-gradient(circle at 30% 30%, #fbc2eb, #a6c1ee);}

  @keyframes rise {
    0% {bottom: -100px; transform: scale(1);}
    50% {transform: scale(1.1);}
    100% {bottom: 100%; transform: scale(1);}
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🎉 Thank you mittal JI! 🎉</h1>
    <h2>File ke liye thank you</h2>
    <h2>par momos ka hisaab abhi pending hai (❁´◡`❁)</h2>

  </div>

  <!-- Balloons -->
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
</body>
</html>
